name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (release / beta / alpha)"
        required: true
        default: "release"
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Read version and changelog
        id: meta
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          awk -v v="$VERSION" '/^## /{p=($2==v)} p' CHANGELOG.md | tail -n +2 > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::No '## $VERSION' section found in CHANGELOG.md"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Publish to CurseForge + Modrinth
        run: |
          export MOD_CHANGELOG="$(cat release_notes.md)"
          ./gradlew publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}

      - name: GitHub Release
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          FLAGS=""
          if [ "${{ inputs.channel }}" != "release" ]; then FLAGS="--prerelease"; fi

          gh release create "$TAG" build/libs/*.jar \
            --title "$TAG" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA" \
            $FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
